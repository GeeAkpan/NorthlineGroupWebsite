<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <!-- Compass N Icon -->
  <g transform="translate(10, 10)">
    <!-- Yellow / Gold Left Column & Diagonal -->
    <path d="M 0,20 Q 0,0 20,0 L 50,0 Q 58,0 66,7 L 96,36 C 92,42 90,48 90,55 C 90,58 91,62 92,65 L 75,48 Q 70,43 64,43 L 30,43 Q 20,43 20,53 L 20,80 Q 20,100 0,100 Z" fill="#FFC306" />
    
    <!-- Dark Navy Right Column & Diagonal -->
    <path d="M 100,20 Q 100,0 80,0 L 80,45 Q 80,50 75,54 L 38,91 Q 30,99 20,99 L 80,99 Q 100,99 100,79 Z" fill="#172B36" />
    
    <!-- Diagonal Main Stem Overlay -->
    <path d="M 30,15 L 85,75 Q 92,83 85,90 L 75,98 Q 68,103 60,95 L 18,50 Z" fill="#172B36" opacity="0.95"/>
    
    <!-- Inner Compass Needle Eye -->
    <g transform="translate(48, 50)">
      <ellipse cx="0" cy="0" rx="22" ry="12" fill="#FFFFFF" transform="rotate(-35)" />
      <polygon points="-18,0 0,-7 18,0 0,7" fill="#172B36" transform="rotate(-35)" />
      <polygon points="0,0 0,-7 18,0" fill="#FFC306" transform="rotate(-35)" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.5" fill="#172B36" />
    </g>
  </g>

  <!-- Typography: Montserrat -->
  <!-- NORTHLINE -->
  <text x="135" y="52" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900" letter-spacing="1">
    <tspan fill="#172B36">NORTH</tspan><tspan fill="#FFC306">LINE</tspan>
  </text>
  
  <!-- AGENCY -->
  <text x="135" y="86" font-family="'Montserrat', sans-serif" font-size="28" font-weight="800" fill="#172B36" letter-spacing="3.5">
    AGENCY
  </text>
  
  <!-- GLOBAL RECRUITMENT SERVICE -->
  <text x="136" y="104" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" fill="#45657A" letter-spacing="1.8">
    GLOBAL RECRUITMENT SERVICE
  </text>
</svg>
